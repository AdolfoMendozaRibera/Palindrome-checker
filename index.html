<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checkers</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>
        <h1>Palindrome Checkers</h1>
        <div class="container">
            <label for="text-input">Enter a text to check if it is a palindrome:</label>
            <input type="text" id="text-input" placeholder="Write here....">
            <button id="check-btn">Check</button>
            <div id="result" class="result"></div>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
